<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2 Result — Solo Dev LLM Bench</title>
    <link rel="stylesheet" href="/static/shared.css">
    <link rel="stylesheet" href="/static/v2-result.css">
</head>
<body>
    <!-- Sticky run summary. Hidden until data loads so we never show placeholder scores. -->
    <header id="v2-sticky" class="v2-sticky hidden" aria-label="V2 result summary">
        <div class="v2-sticky-top">
            <span class="v2-brand">V2 QUALITY</span>
            <span class="v2-sep" aria-hidden="true">·</span>
            <h1 id="v2-model" class="v2-model"></h1>
            <button type="button" id="v2-copy-run" class="v2-mini-btn" title="Copy run ID" aria-label="Copy run ID">⧉ Copy run</button>
        </div>
        <div class="v2-sticky-score">
            <span id="v2-overall" class="v2-overall"></span>
            <span class="v2-pct" id="v2-pct"></span>
            <span id="v2-classification" class="badge v2-badge"></span>
        </div>
        <ul id="v2-suites" class="v2-suite-strip" aria-label="Per-suite scores"></ul>
    </header>

    <main class="container">
        <!-- Loading state (no fake scores) -->
        <p id="v2-loading" class="status v2-status info">Loading V2 result…</p>

        <!-- Error state: readable, no stack traces -->
        <div id="v2-error" class="hidden" role="alert">
            <p class="status v2-status error"><strong>Unable to load V2 result</strong></p>
            <p id="v2-error-detail" class="v2-error-msg"></p>
        </div>

        <!-- Configuration block -->
        <section id="v2-config" class="panel hidden">
            <h2>Configuration</h2>
            <dl class="v2-config-grid">
                <div><dt>Context</dt><dd id="c-context"></dd></div>
                <div><dt>Output policy</dt><dd id="c-output" title=""></dd></div>
                <div><dt>Requested max output</dt><dd id="c-maxout"></dd></div>
                <div><dt>Reasoning</dt><dd id="c-reasoning"></dd></div>
                <div class="v2-grid-span"><dt>Classification</dt>
                    <dd><span id="c-classification" class="badge v2-badge"></span></dd></div>
                <div class="v2-fingerprint-row"><dt>Fingerprint</dt>
                    <dd>
                        <code id="c-fp-short" class="v2-fp-code"></code>
                        <code id="c-fp-full" class="v2-fp-code v2-hidden">N/A</code>
                        <button type="button" id="v2-toggle-fp" class="v2-mini-btn">Full</button>
                        <button type="button" id="v2-copy-fp" class="v2-mini-btn" title="Copy full fingerprint" aria-label="Copy full fingerprint">Copy</button>
                    </dd>
                </div>
            </dl>
        </section>

        <!-- Failure-first diagnostic inspector (Act 7). Renders response.failures,
             grouped by canonical suite. Canonical failed-check counts come from the
             authoritative aggregate; diagnostics are inspection records only.
             The overall /166 score is never derived from these rows. -->
        <section id="v2-failures" class="panel v2-failures-panel hidden">
            <h2>FAILURE DETAILS — <span id="v2-failure-diag-count">0</span> recorded diagnostic(s)</h2>
            <p id="v2-failure-summary" class="v2-headline-counts"></p>

            <!-- Empty state: a future perfect run may have zero diagnostics. -->
            <p id="v2-failures-empty" class="v2-muted v2-hidden">No recorded failure details.</p>

            <!-- Filter / navigation toolbar (Act 8). Built/dynamic where practical.
                 Filtering controls only which diagnostic records are visible; it never
                 changes the headline counts or canonical failed-check numbers. -->
            <div id="v2-failure-toolbar" class="v2-toolbar hidden">
                <div id="v2-suite-filters" class="v2-toolbar-row v2-suite-filters"
                     role="group" aria-label="Filter recorded diagnostics by suite"></div>
                <div class="v2-toolbar-row v2-mid-filters">
                    <label class="v2-filter-field">
                        <span class="v2-filter-label">Type</span>
                        <select id="v2-type-filter" class="v2-select" aria-label="Filter by failure type"></select>
                    </label>
                    <label class="v2-filter-field v2-search-field">
                        <span class="v2-filter-label">Search</span>
                        <input type="search" id="v2-search" class="v2-input"
                               placeholder="Reason, request ID, locator…" autocomplete="off" aria-label="Search diagnostics">
                    </label>
                </div>
                <div class="v2-toolbar-row v2-actions">
                    <button type="button" id="v2-expand-all" class="v2-mini-btn">Expand all</button>
                    <button type="button" id="v2-collapse-all" class="v2-mini-btn">Collapse all</button>
                    <span id="v2-showing-count" class="v2-showing" aria-live="polite"></span>
                </div>
            </div>

            <!-- Grouped diagnostic rows are injected here by JS, in canonical suite order. -->
            <div id="v2-failure-groups"></div>
        </section>
    </main>

    <script src="/static/v2-result.js"></script>
</body>
</html>
