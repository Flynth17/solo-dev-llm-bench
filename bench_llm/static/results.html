<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results — Solo Dev LLM Bench</title>
    <!-- shared.css: base resets + form/table/panel tokens (shared with dashboard) -->
    <link rel="stylesheet" href="/static/shared.css?v=1701">
    <!-- results-shell.css: dark visual system + shared Results shell primitives (RM-26-AA-0016) -->
    <link rel="stylesheet" href="/static/results-shell.css?v=3">
    <link rel="stylesheet" href="/static/results.css?v=1920">
</head>
<body class="results-shell">
    <div class="rs-shell-wrap results-shell">

        <!-- Persistent left sidebar: brand, Results dimension navigation and the escape
         hatch back to benchmarks. Replaces the previous top-level tab bar so Solo Dev
         LLM Bench reads as one coherent product rather than five separate pages.

         Live dimensions (Overall / Speed / Workflow) are keyboard-reachable buttons that
         switch the active view. Future / not-yet-delivered dimensions (Context, Intelligence)
         are disabled: they carry a status chip, are out of tab order and never navigate,
         so the nav reflects actual delivered state instead of implying shipped UI. -->
        <!-- Persistent application shell sidebar. The markup is injected here by the
             shared app-shell.js (single source of truth) so this page does not duplicate
             the sidebar. It carries both the BENCHMARKS home entry and the RESULTS
             dimension navigation; active state is derived from the URL client-side. -->
        <div id="app-sidebar-mount"></div>

        <!-- Results content area. Gains the horizontal space previously used by the tab bar.
             Benchmark-specific filters/controls live inside each view panel below. -->
        <main class="rs-main">

        <!-- Overall view: composite status + per-dimension availability + L0 model list. -->
        <section id="view-overall" class="rs-view rs-active" aria-labelledby="nav-overall">
            <div id="overall-container"></div>
        </section>

        <!-- Speed view (delivered). Preserves the existing point-based history surface;
             filter bar + results panel + empty state are owned by results.js. -->
        <section id="view-speed" class="rs-view" role="tabpanel" aria-labelledby="tab-speed">
            <div id="filter-bar" class="panel filter-panel">
                <h2>Filter Results</h2>
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="filter-model">Model</label>
                        <input type="text" id="filter-model" placeholder="Filter by model name...">
                    </div>
                    <div class="filter-group">
                        <label for="filter-hardware">Hardware</label>
                        <input type="text" id="filter-hardware" placeholder="Filter by hardware...">
                    </div>
                    <div class="filter-group">
                        <label for="filter-env">Environment</label>
                        <select id="filter-env">
                            <option value="">All</option>
                            <option value="Local">Local</option>
                            <option value="Self-hosted">Self-hosted</option>
                            <option value="Cloud">Cloud</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <button id="clear-filters" class="btn-secondary">Clear Filters</button>
                    </div>
                </div>
            </div>

            <div id="results-count" class="results-count"></div>

            <section id="results-panel" class="panel">
                <h2>Past Runs</h2>
                <div id="results-container"></div>
            </section>

            <section id="empty-state" class="panel hidden">
                <h2>No Results Found</h2>
                <p>There are no Standard Speed benchmark results to display. Run a benchmark from the main page to get started.</p>
                <a href="/" class="btn-primary">Run Benchmark</a>
            </section>
        </section>

        <!-- Workflow / Agentic view: delivered; consumes authoritative ranking read model.
             0017 adds a failure-first, filterable run list with suite breakdown and
             per-run drill-down to the dedicated /v2/results/{run_id} evidence page. -->
        <section id="view-workflow" class="rs-view" role="tabpanel" aria-labelledby="tab-workflow">
            <div id="workflow-filter-bar" class="panel filter-panel" hidden>
                <h2>Filter Workflow Results</h2>
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="wf-filter-model">Model</label>
                        <input type="text" id="wf-filter-model" placeholder="Filter by model name...">
                    </div>
                    <div class="filter-group">
                        <label for="wf-filter-status">Run state</label>
                        <select id="wf-filter-status">
                            <option value="">All states</option>
                            <option value="completed">Completed (all checks passed)</option>
                            <option value="partial">Has failures</option>
                            <option value="unknown">Invalid / unknown</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-check">
                            <input type="checkbox" id="wf-filter-failures" /> Show failures only
                        </label>
                    </div>
                    <div class="filter-group">
                        <button id="wf-clear-filters" class="btn-secondary">Clear Filters</button>
                    </div>
                </div>
            </div>
            <div id="workflow-count" class="results-count"></div>
            <div id="workflow-container"></div>
        </section>

        <!-- Context view: benchmark delivered (0009) but final Results UI is RM-26-AA-0018. -->
        <section id="view-context" class="rs-view" role="tabpanel" aria-labelledby="tab-context">
            <div id="context-container"></div>
        </section>

        <!-- Intelligence view: research / not implemented. Not reachable from the disabled
             sidebar nav; retained as an honest placeholder panel only. -->
        <section id="view-intelligence" class="rs-view" aria-labelledby="nav-intelligence">
            <div id="intelligence-container"></div>
        </section>

        </main><!-- /.rs-main -->

    </div>

    <!-- app-shell.js MUST load first: it injects the persistent sidebar (single
         source of truth) and sets active state before results-shell.js wires the
         in-page Results view switching against the injected nav. -->
    <script src="/static/app-shell.js?v=3"></script>
    <script src="/static/results-utils.js?v=1701"></script>
    <script src="/static/results-filters.js?v=1701"></script>
    <script src="/static/results-shell.js?v=3"></script>
    <script src="/static/results.js?v=1920"></script>
</body>
</html>
