<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Dev LLM Bench</title>
    <link rel="stylesheet" href="/static/shared.css">
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <div class="container">
        <h1>Solo Dev LLM Bench</h1>
        <p class="subtitle">Measure performance trade-offs when switching LLMs, hardware, or environments</p>

        <!-- Configuration Panel -->
        <section class="panel" id="config-panel">
            <h2>Configuration</h2>

            <!-- Execution Environment -->
            <div class="form-row">
                <label for="execution-env">Execution Environment</label>
                <select id="execution-env">
                    <option value="Local" selected>Local</option>
                    <option value="Self-hosted">Self-hosted</option>
                    <option value="Cloud">Cloud</option>
                </select>
            </div>

            <!-- Connection Type (shown when Self-hosted) -->
            <div class="form-row hidden" id="connection-row">
                <label for="connection-type">Connection</label>
                <select id="connection-type">
                    <option value="Local network" selected>Local network</option>
                    <option value="Remote connection">Remote connection</option>
                </select>
            </div>

            <!-- Hardware Label -->
            <div class="form-row">
                <label for="hardware-label">Hardware / Machine <span class="optional">(optional)</span></label>
                <input type="text" id="hardware-label" placeholder="e.g. RTX 5090 Desktop, Work Laptop, Raspberry Pi 5">
            </div>

            <div class="form-row">
                <label for="lm-studio-url">LM Studio URL</label>
                <input type="text" id="lm-studio-url" placeholder="http://localhost:1234">
            </div>

            <div class="form-row">
                <label for="model-select">Model</label>
                <div class="model-select-wrapper">
                    <select id="model-select">
                        <option value="">— Select a model —</option>
                    </select>
                    <button id="refresh-models" title="Refresh model list">&#x21bb;</button>
                </div>
            </div>
        </section>

        <!-- Evaluation Suite Panel -->
        <section class="panel" id="evaluation-suite">
            <h2>Evaluation Suite</h2>

            <!-- Speed Checkboxes -->
            <div class="eval-section">
                <h3>Speed Tests</h3>
                <div class="eval-group">
                    <label class="eval-checkbox">
                        <input type="checkbox" id="eval-speed-small" checked>
                        <span>Small Prompt (~250 tokens)</span>
                    </label>
                    <label class="eval-checkbox">
                        <input type="checkbox" id="eval-speed-medium" checked>
                        <span>Medium Prompt (~1,400 tokens)</span>
                    </label>
                    <label class="eval-checkbox">
                        <input type="checkbox" id="eval-speed-large">
                        <span>Large Prompt (~5,300 tokens)</span>
                    </label>
                </div>

                <!-- Speed Iterations -->
                <div class="eval-iterations">
                    <label for="iterations">Speed Iterations</label>
                    <input type="number" id="iterations" value="5" min="1" max="100">
                </div>
            </div>

            <!-- Correctness Checkboxes -->
            <div class="eval-section">
                <h3>Correctness Tests</h3>
                <div class="eval-group">
                    <label class="eval-checkbox">
                        <input type="checkbox" id="eval-correctness-markdown">
                        <span>Markdown Structure</span>
                    </label>
                    <label class="eval-checkbox">
                        <input type="checkbox" id="eval-correctness-python">
                        <span>Python Code Correctness</span>
                    </label>
                    <label class="eval-checkbox">
                        <input type="checkbox" id="eval-correctness-java">
                        <span>Java Code Correctness</span>
                    </label>
                    <label class="eval-checkbox">
                        <input type="checkbox" id="eval-correctness-unsolvable">
                        <span>Unsolvable Recognition</span>
                    </label>
                </div>
            </div>

            <!-- Benchmark Parameters -->
            <div class="form-row-inline eval-params">
                <div class="form-row half">
                    <label for="max-tokens">Max Output Tokens</label>
                    <input type="number" id="max-tokens" value="100000" min="1" max="10000000">
                </div>
                <div class="form-row half">
                    <label for="temperature">Temperature</label>
                    <input type="number" id="temperature" value="0" min="0" max="2" step="0.1">
                </div>
            </div>

            <!-- Run Evaluation Button -->
            <button id="run-evaluation" class="btn-primary">Run Evaluation</button>
        </section>

        <!-- Advanced / Custom Benchmark (collapsible) -->
        <details class="collapsible" id="advanced-benchmark">
            <summary class="collapsible-header">&#x25B6; Advanced / Custom Benchmark</summary>
            <div class="collapsible-body">
                <!-- Prompt Preset Selector -->
                <div class="form-row">
                    <label for="prompt-preset">Prompt preset</label>
                    <div class="prompt-presets-wrapper">
                        <select id="prompt-preset">
                            <option value="">— Custom —</option>
                        </select>
                        <button id="save-prompt-btn" title="Save current prompt as preset">&#x1F4BE;</button>
                        <button id="rename-prompt-btn" title="Rename selected preset">&#x270E;</button>
                        <button id="delete-prompt-btn" title="Delete selected preset">&#x1F5D1;</button>
                    </div>
                </div>

                <div class="form-row">
                    <label for="prompt">Benchmark Prompt</label>
                    <textarea id="prompt" rows="3">Write a short story about a robot learning to feel emotions.</textarea>
                </div>

                <!-- Existing Run Benchmark button preserved for transitional use -->
                <button id="run-benchmark" class="btn-secondary">Run Benchmark</button>
            </div>
        </details>

        <!-- Status -->
        <section id="status" class="status hidden"></section>

        <!-- Results Panel -->
        <section id="results-panel" class="panel hidden">
            <h2>Results</h2>
            <div id="results-container"></div>
            <div id="results-charts"></div>
        </section>

        <!-- Advanced Task Manager (collapsible) -->
        <details class="collapsible" id="advanced-tasks">
            <summary class="collapsible-header">&#x25B6; Advanced Task Manager</summary>
            <div class="collapsible-body">
                <div class="task-toolbar">
                    <select id="task-type-select">
                        <option value="markdown">Markdown Structure</option>
                        <option value="python">Python Code Quality</option>
                        <option value="java">Java Code Quality</option>
                    </select>
                    <input type="text" id="task-name-input" placeholder="Task name (optional)">
                    <button id="create-task-btn" class="btn-secondary">+ Create Task</button>
                </div>
                <div id="task-list-container">
                    <div id="task-list"></div>
                </div>
            </div>
        </details>

        <!-- View all past results -->
        <div class="view-all-link">
            <a href="/results">View all past results →</a>
        </div>
    </div>

    <script src="/static/dashboard-charts.js"></script>
    <script src="/static/dashboard-prompts.js"></script>
    <script src="/static/dashboard-tasks.js"></script>
    <script src="/static/dashboard.js"></script>
    </body>
    </html>
