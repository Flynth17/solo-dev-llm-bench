[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
filterwarnings = ignore

markers =
    slow: offline but heavy V2-quality persistence/executor tests (real async retry backoff; ~8-15s each). Excluded from the fast gate. Kept in the full regression suite.
    integration: tests that execute real external toolchains via subprocess (e.g. Java javac/java). Excluded from the fast gate to stay JDK/toolchain-free and deterministic. Kept in the full regression suite.
    live: requires a loaded model / live LM Studio endpoint. Reserved for future model-backed runs; excluded from the fast gate.